# H5-K5: WAF ilk çalıştırma (ModSecurity + OWASP CRS, DetectionOnly)
# Çalıştırma: docker compose up -d   |   Giriş noktası: http://localhost:8080
services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    expose:
      - "3000"          # host'a açılmaz, sadece WAF erişir
    networks: [lab]

  waf:
    image: owasp/modsecurity-crs:nginx   # nginx + ModSecurity v3 + CRS bir arada
    container_name: waf-nginx
    restart: unless-stopped
    depends_on: [juice-shop]
    ports:
      - "8080:8080"
    environment:
      BACKEND: http://juice-shop:3000
      PORT: "8080"
      PROXY: "1"
      # --- ModSecurity ---
      MODSEC_RULE_ENGINE: DetectionOnly      # sadece logla, engelleme YOK
      MODSEC_AUDIT_ENGINE: RelevantOnly      # sadece kural tetikleyen istekler
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit.log
      # --- CRS ---
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      # --- nginx logları ---
      ACCESSLOG: /var/log/nginx/access.log
      ERRORLOG: /var/log/nginx/error.log
      LOGLEVEL: warn
    volumes:
      - ./nginx/logging.conf.template:/etc/nginx/templates/conf.d/logging.conf.template:ro
      - ./logs/nginx:/var/log/nginx
      - ./logs/modsecurity:/var/log/modsecurity
    networks: [lab]
  suricata:
      image: jasonish/suricata:latest
      container_name: lab-suricata
      restart: unless-stopped
      network_mode: "service:waf"
      cap_add:
        - NET_ADMIN
        - NET_RAW
        - SYS_NICE
      depends_on:
        - waf
      command: -i eth0 -S /etc/suricata/custom/local.rules
      volumes:
        - ./suricata/rules:/etc/suricata/custom
        - ./suricata/logs:/var/log/suricata

networks:
  lab: